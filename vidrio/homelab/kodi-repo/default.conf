server {
    listen 80;
    server_name _;
    root /data/repo;
    autoindex off;
    server_tokens off;

    location = /addons.xml     { add_header Cache-Control "no-cache"; }
    location = /addons.xml.md5 { add_header Cache-Control "no-cache"; }
    location ~ \.(zip|zip\.sha256|png)$ { }
    location /                 { return 404; }
}
