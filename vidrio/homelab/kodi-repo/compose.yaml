# Repositorio de add-ons de Vidrio para los Kodi de casa (lo arma y lo sube vidrio/herramientas/repo.py).
# Solo lectura y solo en la IP de la red local. En el homelab va en /opt/kodi-repo; IP_HOMELAB sale de .env.
services:
  kodi-repo:
    image: nginx:1.27-alpine
    container_name: kodi-repo
    restart: unless-stopped
    ports:
      - "${IP_HOMELAB:-192.168.1.50}:8099:80"
    volumes:
      # La carpeta de arriba, no repo/: repo.py reemplaza repo/ de una vez y un montaje directo seguiría viendo la vieja
      - /srv/kodi-addons:/data:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
